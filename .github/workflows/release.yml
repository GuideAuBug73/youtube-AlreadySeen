name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the manifest version
        run: |
          manifest_version=$(jq -r .version already-seen/manifest.json)
          if [ "v${manifest_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match manifest version ${manifest_version}" >&2
            exit 1
          fi

      - name: Build the zip
        run: |
          cd already-seen
          zip -r "../already-seen-${GITHUB_REF_NAME}.zip" . -x "capture-*.png"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "already-seen-${GITHUB_REF_NAME}.zip" \
            --title "AlreadySeen ${GITHUB_REF_NAME}" \
            --generate-notes
